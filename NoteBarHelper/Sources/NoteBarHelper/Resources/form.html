<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 12px;
         background: var(--bg, #fff); color: var(--fg, #111); }
  h1 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
  .word { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  label { display: block; margin: 8px 0 3px; font-size: 12px; opacity: .75; }
  /* 复选框必须排除在 width:100% 之外：否则它会被拉成整行宽，把后面的文字挤成竖排一列一个字 */
  input:not([type="checkbox"]), textarea, select { width: 100%; box-sizing: border-box; font: inherit; padding: 4px 6px;
                            border: 1px solid rgba(128,128,128,.4); border-radius: 5px;
                            background: rgba(128,128,128,.08); color: inherit; }
  input[type="checkbox"] { width: 13px; height: 13px; margin: 0; flex: 0 0 auto; accent-color: #4c6ef5; }
  textarea { height: 62px; resize: vertical; }
  .books { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 4px; align-items: center; }
  /* 词库项允许换行到下一行，但自身不被压缩、名字不逐字折行 */
  .books label { display: inline-flex; align-items: center; gap: 5px; margin: 0; font-size: 12px; opacity: 1;
                 flex: 0 0 auto; white-space: nowrap; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row > div { flex: 1; }
  .label-row { display: flex; align-items: baseline; justify-content: space-between; margin: 8px 0 3px; }
  .label-row label { margin: 0; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  button { font: inherit; padding: 4px 12px; border-radius: 5px; border: 1px solid rgba(128,128,128,.4);
           background: rgba(128,128,128,.12); cursor: pointer; }
  button.primary { background: #4c6ef5; border-color: #4c6ef5; color: #fff; }
  button.small { padding: 2px 8px; font-size: 11px; }
  button:disabled { opacity: .5; cursor: default; }
  .status { font-size: 11px; margin-top: 5px; min-height: 14px; white-space: pre-wrap; }
  .status.err { color: #e03131; }
  .status.info { opacity: .7; }
  .src { font-size: 11px; opacity: .6; margin-top: 8px; }
</style>
</head>
<body>
  <h1>加入词库</h1>
  <div class="word" id="word"></div>

  <div class="label-row">
    <label for="definition">释义</label>
    <button class="small" id="ai" title="用 vault 里配置的 AI 服务生成别名与释义">AI 释义</button>
  </div>
  <textarea id="definition" placeholder="可留空，插件会用本地词典补全"></textarea>
  <div class="status" id="ai-status"></div>

  <div class="row">
    <div>
      <label for="aliases">别名（逗号分隔）</label>
      <input id="aliases" placeholder="如 considerations, consider">
    </div>
    <div style="flex:0 0 96px">
      <label for="color">卡片颜色</label>
      <select id="color">
        <option value="">默认</option>
        <option value="1">红</option><option value="2">橙</option><option value="3">黄</option>
        <option value="4">绿</option><option value="5">青</option><option value="6">紫</option>
      </select>
    </div>
  </div>

  <label>目标单词本（仅 .canvas）</label>
  <div class="books" id="books"></div>

  <label for="sentence">例句（来自选区上下文）</label>
  <input id="sentence" readonly>

  <div class="actions">
    <button id="cancel">取消</button>
    <button class="primary" id="submit">加入词库</button>
  </div>
  <div class="src" id="src"></div>

<script>
  const post = (payload) => window.webkit.messageHandlers.nbh.postMessage(payload);
  let init = null;

  window.nbhInit = (payload) => {
    init = payload;
    document.getElementById('word').textContent = payload.word || '（未取到文本）';
    document.getElementById('sentence').value = payload.sentence || '';
    document.getElementById('definition').value = payload.definition || '';
    document.getElementById('aliases').value = (payload.aliases || []).join(', ');
    document.getElementById('src').textContent =
      `来源：${payload.originApp || '未知应用'}｜取词方式：${payload.source}`;
    const box = document.getElementById('books');
    box.innerHTML = '';
    for (const book of payload.books) {
      const wrap = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.value = book.path; cb.checked = book.defaultChecked;
      wrap.appendChild(cb);
      wrap.appendChild(document.createTextNode(book.name));
      box.appendChild(wrap);
    }
  };

  document.getElementById('submit').onclick = () => {
    const books = [...document.querySelectorAll('#books input:checked')].map(i => i.value);
    post({ action: 'submit', books,
           definition: document.getElementById('definition').value,
           aliases: document.getElementById('aliases').value,
           color: document.getElementById('color').value,
           sentence: document.getElementById('sentence').value });
  };
  document.getElementById('cancel').onclick = () => post({ action: 'cancel' });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') post({ action: 'cancel' });
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) document.getElementById('submit').click();
  });

  // —— 原生端补充入口 ——

  const setStatus = (text, cls) => {
    const el = document.getElementById('ai-status');
    el.textContent = text || '';
    el.className = 'status' + (cls ? ' ' + cls : '');
  };

  // 本地词典预填：只填还空着的字段，绝不覆盖用户已经输入/修改过的内容
  window.nbhFill = (payload) => {
    if (!payload) return;
    const def = document.getElementById('definition');
    const aliases = document.getElementById('aliases');
    if (payload.definition && !def.value.trim()) def.value = payload.definition;
    if (payload.aliases && !aliases.value.trim()) aliases.value = payload.aliases;
    setStatus('已从本地词典预填', 'info');
  };

  // AI 释义结果：成功回填别名/释义，失败显示可见错误
  window.nbhFillAI = (payload) => {
    if (!payload) return;
    if (payload.error) { setStatus('AI 释义失败：' + payload.error, 'err'); setAIButtonLoading(false); return; }
    const def = document.getElementById('definition');
    const aliases = document.getElementById('aliases');
    if (payload.definition) def.value = payload.definition;
    if (payload.aliases && !aliases.value.trim()) aliases.value = payload.aliases;
    setStatus('AI 释义已填入', 'info');
    setAIButtonLoading(false);
  };

  window.nbhStatus = (text, isError) => setStatus(text, isError ? 'err' : 'info');

  const setAIButtonLoading = (loading) => {
    const button = document.getElementById('ai');
    button.disabled = loading;
    button.textContent = loading ? '查询中…' : 'AI 释义';
  };

  document.getElementById('ai').onclick = () => {
    setAIButtonLoading(true);
    setStatus('正在请求 AI 服务…', 'info');
    post({ action: 'aiExplain',
           word: document.getElementById('word').textContent,
           sentence: document.getElementById('sentence').value });
  };

  // 脚本就绪后立刻通知原生端：原生端会等这个信号再推初始化数据，
  // 否则 window.nbhInit 尚未定义，evaluateJavaScript 会静默失败（面板一片空白）。
  post({ action: 'ready' });
</script>
</body>
</html>
