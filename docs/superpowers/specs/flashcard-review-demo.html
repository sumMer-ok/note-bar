<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Note Bar 闪卡复习 Demo</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #1e1e1e;
      --surface: #2a2a2a;
      --surface-light: #333333;
      --text: #e0e0e0;
      --text-muted: #999999;
      --accent: #7cacf8;
      --accent-hover: #9ac0ff;
      --danger: #ff7b72;
      --warning: #ffa657;
      --success: #7ee787;
      --super-easy: #a5d6ff;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .obsidian-mock {
      position: absolute;
      inset: 0;
      opacity: 0.25;
      pointer-events: none;
      background:
        linear-gradient(90deg, #252525 260px, transparent 260px),
        repeating-linear-gradient(0deg, transparent, transparent 31px, #2a2a2a 31px, #2a2a2a 32px);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      width: min(720px, 92vw);
      height: min(600px, 86vh);
      background: var(--surface);
      border-radius: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .mode-toggle {
      display: flex;
      background: var(--surface-light);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #111;
      font-weight: 600;
    }

    .progress {
      font-size: 14px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .close-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }

    .body {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 32px 20px;
      position: relative;
      perspective: 1200px;
      min-height: 0;
    }

    .card-scene {
      width: 100%;
      max-width: 520px;
      height: 380px;
      max-height: 100%;
      position: relative;
      transform-style: preserve-3d;
      flex-shrink: 1;
    }

    .card {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .card.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      background: var(--surface-light);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      padding: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .card-face.back {
      transform: rotateY(180deg);
      align-items: flex-start;
      text-align: left;
      justify-content: flex-start;
    }

    .word {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #fff 0%, #c7d2ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .phonetic {
      font-size: 18px;
      color: var(--text-muted);
      font-family: "Times New Roman", serif;
      margin-bottom: 20px;
    }

    .speak-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .speak-btn:hover { background: rgba(124, 172, 248, 0.12); transform: scale(1.08); }

    .flip-hint {
      font-size: 12px;
      color: var(--text-muted);
      opacity: 0.7;
      margin-top: 12px;
    }

    .spell-section {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 280px;
    }

    .spell-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.2);
      color: var(--text);
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: all 0.2s ease;
    }

    .spell-input.correct {
      border-color: var(--success);
      color: var(--success);
      background: rgba(126, 231, 135, 0.08);
    }

    .spell-input.wrong {
      border-color: var(--danger);
      color: var(--danger);
      background: rgba(255, 123, 114, 0.08);
    }

    .spell-feedback {
      font-size: 12px;
      min-height: 18px;
      color: var(--text-muted);
    }

    .back-header {
      width: 100%;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .back-word {
      font-size: 24px;
      font-weight: 700;
    }

    .back-phonetic {
      font-size: 14px;
      color: var(--text-muted);
      font-family: "Times New Roman", serif;
    }

    .notes {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
    }

    .notes::-webkit-scrollbar { width: 6px; }
    .notes::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

    .notes strong { color: var(--accent-hover); }

    .footer {
      padding: 14px 32px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .rating-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }

    .rating-btn {
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      min-width: 80px;
      color: #111;
      position: relative;
      overflow: hidden;
    }

    .rating-btn::after {
      content: attr(data-key);
      font-size: 11px;
      opacity: 0.6;
      font-weight: 500;
    }

    .rating-btn.again { background: var(--danger); }
    .rating-btn.hard { background: var(--warning); }
    .rating-btn.good { background: var(--success); }

    .rating-btn:hover { transform: translateY(-2px) scale(1.03); filter: brightness(1.1); }
    .rating-btn:active { transform: translateY(0) scale(0.97); }

    .super-easy-btn {
      border: 1px solid rgba(165, 214, 255, 0.35);
      background: rgba(165, 214, 255, 0.08);
      color: var(--super-easy);
      border-radius: 12px;
      padding: 8px 16px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .super-easy-btn:hover { background: rgba(165, 214, 255, 0.15); transform: translateY(-1px); }

    .hint {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
    }

    .hint kbd {
      background: rgba(255,255,255,0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: inherit;
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* 切题动画 */
    .card.slide-out-right {
      animation: slideOutRight 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .card.slide-out-left {
      animation: slideOutLeft 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .card.slide-in {
      animation: slideIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes slideOutRight {
      to { transform: translateX(140%) rotate(12deg); opacity: 0; }
    }

    @keyframes slideOutLeft {
      to { transform: translateX(-140%) rotate(-12deg); opacity: 0; }
    }

    @keyframes slideIn {
      from { transform: translateX(0) scale(0.85); opacity: 0; }
      to { transform: translateX(0) scale(1); opacity: 1; }
    }

    .end-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .end-screen.show {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .end-title { font-size: 28px; font-weight: 700; }
    .end-stats {
      display: flex;
      gap: 32px;
      font-size: 15px;
      color: var(--text-muted);
    }
    .end-stat strong { display: block; font-size: 26px; color: var(--text); margin-bottom: 4px; }

    .end-actions {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .primary-btn, .secondary-btn {
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .primary-btn { background: var(--accent); color: #111; }
    .primary-btn:hover { background: var(--accent-hover); }
    .secondary-btn { background: var(--surface-light); color: var(--text); }
    .secondary-btn:hover { background: rgba(255,255,255,0.1); }

    .toast {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--surface-light);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      color: var(--text);
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .definition-front {
      font-size: 22px;
      line-height: 1.6;
      color: var(--text);
      max-height: 220px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="obsidian-mock"></div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="header">
        <div class="mode-toggle">
          <button class="mode-btn active" data-mode="word">英→中</button>
          <button class="mode-btn" data-mode="definition">中→英</button>
        </div>
        <div class="progress"><span id="currentIndex">1</span> / <span id="totalCount">5</span></div>
        <button class="close-btn" id="closeBtn">×</button>
      </div>

      <div class="body">
        <div class="toast" id="toast"></div>

        <div class="card-scene">
          <div class="card" id="card">
            <div class="card-face front" id="frontFace">
              <div class="word" id="frontWord">serendipity</div>
              <div class="phonetic" id="frontPhonetic">/ˌser.ənˈdɪp.ə.ti/</div>
              <button class="speak-btn" id="speakBtn" title="播放发音">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
              </button>
              <div class="spell-section">
                <input type="text" class="spell-input" id="spellInput" placeholder="输入单词后按回车检查拼写" autocomplete="off" />
                <div class="spell-feedback" id="spellFeedback"></div>
              </div>
              <div class="flip-hint">按 空格 或点击卡片翻转</div>
            </div>
            <div class="card-face back" id="backFace">
              <div class="back-header">
                <div>
                  <div class="back-word" id="backWord">serendipity</div>
                  <div class="back-phonetic" id="backPhonetic">/ˌser.ənˈdɪp.ə.ti/</div>
                </div>
              </div>
              <div class="notes" id="backNotes"></div>
            </div>
          </div>
        </div>

        <div class="end-screen" id="endScreen">
          <div class="end-title">本轮复习完成</div>
          <div class="end-stats">
            <div class="end-stat"><strong id="statTotal">0</strong>复习单词</div>
            <div class="end-stat"><strong id="statNew">0</strong>新词</div>
            <div class="end-stat"><strong id="statMastered">0</strong>已掌握</div>
          </div>
          <div class="end-actions">
            <button class="primary-btn" id="restartBtn">再复习一组</button>
            <button class="secondary-btn" id="finishBtn">完成</button>
          </div>
        </div>
      </div>

      <div class="footer">
        <div class="rating-row">
          <button class="rating-btn again" data-rating="again" data-key="s">不认识</button>
          <button class="rating-btn hard" data-rating="hard" data-key="d">模糊</button>
          <button class="rating-btn good" data-rating="good" data-key="f">认识</button>
        </div>
        <button class="super-easy-btn" id="superEasyBtn">太简单</button>
        <div class="hint">
          <span><kbd>空格</kbd> 翻转</span>
          <span><kbd>s</kbd> 不认识</span>
          <span><kbd>d</kbd> 模糊</span>
          <span><kbd>f</kbd> 认识</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const cards = [
      {
        word: 'serendipity',
        phonetic: '/ˌser.ənˈdɪp.ə.ti/',
        notes: `**n.** 意外发现珍奇事物的能力；机缘巧合\n\n*serendipitous, serendipitously*\n\n**例句：** The discovery of penicillin was a fortunate serendipity.\n青霉素的发现是一次幸运的机缘巧合。\n\n**笔记：** 常用来形容科学发现或生活中的意外之喜。`
      },
      {
        word: 'ephemeral',
        phonetic: '/ɪˈfem.ər.əl/',
        notes: `**adj.** 短暂的，瞬息万变的\n\n*ephemerality*\n\n**例句：** Fashion is by nature ephemeral.\n时尚本质上是短暂的。\n\n**笔记：** 与 temporary 近义，但更带有文学色彩。`
      },
      {
        word: 'resilient',
        phonetic: '/rɪˈzɪl.jənt/',
        notes: `**adj.** 有弹性的；能迅速恢复的\n\n*resilience*\n\n**例句：** She is a resilient person who never gives up.\n她是一个坚韧不拔、永不放弃的人。\n\n**笔记：** 常用来形容人或组织在挫折后的恢复能力。`
      },
      {
        word: 'ubiquitous',
        phonetic: '/juːˈbɪk.wɪ.təs/',
        notes: `**adj.** 无处不在的，十分普遍的\n\n*ubiquity*\n\n**例句：** Smartphones have become ubiquitous in modern life.\n智能手机在现代生活中已经无处不在。\n\n**笔记：** 比 everywhere 更正式，常用于学术写作。`
      },
      {
        word: 'pragmatic',
        phonetic: '/præɡˈmæt.ɪk/',
        notes: `**adj.** 务实的，实事求是的\n\n*pragmatism, pragmatically*\n\n**例句：** We need a pragmatic approach to solve this problem.\n我们需要一种务实的方法来解决这个问题。\n\n**笔记：** 与 idealistic 相对，强调实际效果。`
      }
    ];

    let currentIndex = 0;
    let mode = 'word';
    let flipped = false;
    let stats = { total: 0, new: 0, mastered: 0 };
    let animating = false;

    const card = document.getElementById('card');
    const frontFace = document.getElementById('frontFace');
    const backFace = document.getElementById('backFace');
    const frontWord = document.getElementById('frontWord');
    const frontPhonetic = document.getElementById('frontPhonetic');
    const backWord = document.getElementById('backWord');
    const backPhonetic = document.getElementById('backPhonetic');
    const backNotes = document.getElementById('backNotes');
    const currentIndexEl = document.getElementById('currentIndex');
    const totalCountEl = document.getElementById('totalCount');
    const endScreen = document.getElementById('endScreen');
    const toast = document.getElementById('toast');
    const spellInput = document.getElementById('spellInput');
    const spellFeedback = document.getElementById('spellFeedback');

    function resetSpellState() {
      spellInput.value = '';
      spellInput.classList.remove('correct', 'wrong');
      spellFeedback.textContent = '';
      spellInput.placeholder = mode === 'word' ? '输入单词后按回车检查拼写' : '输入英文单词后按回车检查';
    }

    function renderCard() {
      const data = cards[currentIndex];
      resetSpellState();
      if (mode === 'word') {
        frontWord.textContent = data.word;
        frontWord.classList.remove('definition-front');
        frontPhonetic.style.display = 'block';
        frontPhonetic.textContent = data.phonetic;
      } else {
        frontWord.textContent = extractDefinition(data.notes);
        frontWord.classList.add('definition-front');
        frontPhonetic.style.display = 'none';
      }
      backWord.textContent = data.word;
      backPhonetic.textContent = data.phonetic;
      backNotes.textContent = data.notes;
      currentIndexEl.textContent = currentIndex + 1;
      totalCountEl.textContent = cards.length;
    }

    function extractDefinition(notes) {
      const match = notes.match(/\*\*[^*]+\*\*\s*[^\n]+/);
      return match ? match[0].replace(/\*\*/g, '') : notes.split('\n')[0];
    }

    function flip() {
      if (animating) return;
      flipped = !flipped;
      card.classList.toggle('flipped', flipped);
    }

    function rate(rating) {
      if (animating) return;
      animating = true;
      stats.total++;
      if (rating === 'easy') stats.mastered++;
      if (currentIndex < 2) stats.new++;

      const direction = (rating === 'good' || rating === 'easy') ? 'right' : 'left';
      const label = { again: '不认识', hard: '模糊', good: '认识', easy: '太简单' }[rating];
      showToast(label + ' · 已记录');

      card.classList.add(direction === 'right' ? 'slide-out-right' : 'slide-out-left');

      setTimeout(() => {
        currentIndex++;
        if (currentIndex >= cards.length) {
          showEnd();
          return;
        }
        flipped = false;
        card.classList.remove('flipped', 'slide-out-right', 'slide-out-left');
        card.classList.add('slide-in');
        renderCard();
        setTimeout(() => {
          card.classList.remove('slide-in');
          animating = false;
        }, 550);
      }, 450);
    }

    function showEnd() {
      document.querySelector('.card-scene').style.opacity = '0';
      document.querySelector('.footer').style.opacity = '0';
      document.getElementById('statTotal').textContent = stats.total;
      document.getElementById('statNew').textContent = stats.new;
      document.getElementById('statMastered').textContent = stats.mastered;
      endScreen.classList.add('show');
      animating = false;
    }

    function restart() {
      currentIndex = 0;
      flipped = false;
      stats = { total: 0, new: 0, mastered: 0 };
      document.querySelector('.card-scene').style.opacity = '1';
      document.querySelector('.footer').style.opacity = '1';
      endScreen.classList.remove('show');
      card.classList.remove('flipped');
      renderCard();
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1600);
    }

    // Events
    card.addEventListener('click', flip);

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mode = btn.dataset.mode;
        flipped = false;
        card.classList.remove('flipped');
        renderCard();
      });
    });

    document.querySelectorAll('.rating-btn').forEach(btn => {
      btn.addEventListener('click', () => rate(btn.dataset.rating));
    });

    document.getElementById('superEasyBtn').addEventListener('click', () => rate('easy'));
    document.getElementById('speakBtn').addEventListener('click', e => {
      e.stopPropagation();
      const word = cards[currentIndex].word;
      const audio = new Audio(`https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(word)}&type=2`);
      audio.play().catch(() => showToast('🔊 ' + word));
    });
    document.getElementById('restartBtn').addEventListener('click', restart);
    document.getElementById('finishBtn').addEventListener('click', () => showToast('Demo 结束'));
    document.getElementById('closeBtn').addEventListener('click', () => showToast('关闭弹窗'));

    spellInput.addEventListener('click', e => {
      e.stopPropagation();
    });

    spellInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const input = spellInput.value.trim().toLowerCase();
        const target = cards[currentIndex].word.toLowerCase();
        spellInput.classList.remove('correct', 'wrong');
        if (input === target) {
          spellInput.classList.add('correct');
          spellFeedback.textContent = '✓ 拼写正确';
        } else {
          spellInput.classList.add('wrong');
          spellFeedback.textContent = `✗ 正确拼写：${cards[currentIndex].word}`;
        }
      }
    });

    spellInput.addEventListener('input', () => {
      spellInput.classList.remove('correct', 'wrong');
      spellFeedback.textContent = '';
    });

    document.addEventListener('keydown', e => {
      if (e.target === spellInput) return;
      if (e.key === ' ') {
        e.preventDefault();
        flip();
      } else if (e.key === 'f' || e.key === 'F') {
        rate('good');
      } else if (e.key === 'd' || e.key === 'D') {
        rate('hard');
      } else if (e.key === 's' || e.key === 'S') {
        rate('again');
      }
    });

    renderCard();
  </script>
</body>
</html>
