name: NoteBarApp
options:
  bundleIdPrefix: com.notebar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  NoteBarApp:
    type: application
    platform: iOS
    sources:
      - NoteBarApp
    entitlements:
      path: NoteBarApp/NoteBarApp.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notebar.NoteBarApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - NoteBarAppTests
        - NoteBarAppUITests
  NoteBarAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NoteBarAppTests
    dependencies:
      - target: NoteBarApp
    resources:
      - NoteBarAppTests/Fixtures/sync-vectors.json
  NoteBarAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - NoteBarAppUITests
    dependencies:
      - target: NoteBarApp
